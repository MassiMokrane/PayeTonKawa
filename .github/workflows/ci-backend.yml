name: CI Backend Services

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/auth-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/auth-service/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/auth-service/coverage/lcov.info
        flags: auth-service
        name: auth-service-coverage
      if: success()

  test-product-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/product-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/product-service/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/product-service/coverage/lcov.info
        flags: product-service
        name: product-service-coverage
      if: success()

  test-order-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/order-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/order-service/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/order-service/coverage/lcov.info
        flags: order-service
        name: order-service-coverage
      if: success()

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-product-service, test-order-service]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies for all services
      run: |
        cd backend/auth-service && npm ci
        cd ../product-service && npm ci
        cd ../order-service && npm ci
    
    - name: Run integration tests
      run: |
        cd backend/order-service
        npm test -- --testPathPattern=integration --coverage --watchAll=false --passWithNoTests
      env:
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: test_db

  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-product-service, test-order-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies for all services
      run: |
        cd backend/auth-service && npm ci
        cd ../product-service && npm ci
        cd ../order-service && npm ci
    
    - name: Run tests with coverage
      run: |
        cd backend/auth-service && npm test -- --coverage --watchAll=false --passWithNoTests
        cd ../product-service && npm test -- --coverage --watchAll=false --passWithNoTests
        cd ../order-service && npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Run SonarQube Analysis
      uses: sonarqube-quality-gate-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scannerHomeDir: /opt/sonar-scanner
        args: >
          -Dsonar.projectKey=payetonkawa-backend
          -Dsonar.sources=backend
          -Dsonar.javascript.lcov.reportPaths=backend/*/coverage/lcov.info
          -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**,**/node_modules/**,**/coverage/**
          -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js,**/tests/**
          -Dsonar.testExecutionReportPaths=backend/*/coverage/test-report.xml

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-auth-service, test-product-service, test-order-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push auth-service
      uses: docker/build-push-action@v5
      with:
        context: ./backend/auth-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/payetonkawa-auth-service:latest,${{ secrets.DOCKER_USERNAME }}/payetonkawa-auth-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push product-service
      uses: docker/build-push-action@v5
      with:
        context: ./backend/product-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/payetonkawa-product-service:latest,${{ secrets.DOCKER_USERNAME }}/payetonkawa-product-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push order-service
      uses: docker/build-push-action@v5
      with:
        context: ./backend/order-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/payetonkawa-order-service:latest,${{ secrets.DOCKER_USERNAME }}/payetonkawa-order-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max 