name: CD Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push latest images
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/payetonkawa-auth-service:latest ./backend/auth-service
        docker build -t ${{ secrets.DOCKER_USERNAME }}/payetonkawa-product-service:latest ./backend/product-service
        docker build -t ${{ secrets.DOCKER_USERNAME }}/payetonkawa-order-service:latest ./backend/order-service
        
        docker push ${{ secrets.DOCKER_USERNAME }}/payetonkawa-auth-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/payetonkawa-product-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/payetonkawa-order-service:latest
    
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/payetonkawa
          docker-compose pull
          docker-compose up -d
          docker system prune -f

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/payetonkawa/frontend
          git pull origin main
          npm ci
          npm run build
          sudo systemctl restart nginx

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Wait for services to be ready
      run: sleep 60
    
    - name: Health check backend services
      run: |
        curl -f http://${{ secrets.PROD_HOST }}:5000/api/auth/health || echo "Auth service health check failed"
        curl -f http://${{ secrets.PROD_HOST }}:5001/api/products/health || echo "Product service health check failed"
        curl -f http://${{ secrets.PROD_HOST }}:5002/api/orders/health || echo "Order service health check failed"
    
    - name: Health check frontend
      run: |
        curl -f http://${{ secrets.PROD_HOST }} || echo "Frontend health check failed"
    
    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: 'Deployment to production completed successfully!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: success()

  rollback:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Rollback deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/payetonkawa
          docker-compose down
          git reset --hard HEAD~1
          docker-compose up -d
    
    - name: Notify deployment failure
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: 'Deployment failed! Rollback completed.'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 