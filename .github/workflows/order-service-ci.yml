name: Order Service CI/CD

on:
  push:
    branches: [main, develop, Mokrane_UP]
    paths:
      - "backend/order-service/**"
      - ".github/workflows/order-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/order-service/**"

jobs:
  test-order-service:
    runs-on: ubuntu-latest
    name: Build & Test Order Service

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orderdb
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmqctl status"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/order-service/package-lock.json

      - name: Install Dependencies
        working-directory: backend/order-service
        run: |
          echo " Installing npm packages for Order Service..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: ⏳ Wait for MySQL
        run: |
          echo "⏳ Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3309 --silent; then
              echo "✅ MySQL is ready!"
              break
            fi
            echo "⏳ MySQL not ready yet... ($i/30)"
            sleep 3
          done

      - name: ⏳ Wait for RabbitMQ
        run: |
          echo "⏳ Waiting for RabbitMQ to be ready..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:15672/api/overview -u admin:password >/dev/null 2>&1; then
              echo "✅ RabbitMQ is ready!"
              break
            fi
            echo "⏳ RabbitMQ not ready yet... ($i/30)"
            sleep 3
          done

      - name: Run Tests
        working-directory: backend/order-service
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3309
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: orderdb
          RABBITMQ_URL: amqp://admin:password@127.0.0.1:5672
          PORT: 5002
        run: |
          echo " Running tests for Order Service..."
          npm test
          echo "✅ All tests passed!"

      - name: Build Docker Image
        working-directory: backend/order-service
        run: |
          echo " Building Docker image for Order Service..."
          docker build -t payetonkawa-order:${{ github.sha }} .
          echo "✅ Docker image built successfully!"

      - name: Security Audit
        working-directory: backend/order-service
        run: |
          echo " Running security audit..."
          npm audit --audit-level high || echo "⚠️ Security audit completed with warnings"
