name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: --health-cmd="rabbitmq-diagnostics ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies for all services
      run: |
        cd backend/auth-service && npm ci
        cd ../product-service && npm ci
        cd ../order-service && npm ci
    
    - name: Wait for services to be ready
      run: |
        sleep 30
        echo "Services should be ready now"
    
    - name: Run integration tests
      run: |
        cd backend/order-service
        npm test -- --testPathPattern=integration --coverage --watchAll=false --passWithNoTests
      env:
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: test_db
        RABBITMQ_URL: amqp://localhost:5672
        JWT_SECRET: test-secret
    
    - name: Upload integration test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/order-service/coverage/lcov.info
        flags: integration-tests
        name: integration-tests-coverage
      if: success() 