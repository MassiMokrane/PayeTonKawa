name: ☕️ PayeTonKawa - Full CI/CD Pipeline

on:
  push:
    branches: [main, develop, Mokrane_UP]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "18"
  MYSQL_ROOT_PASSWORD: root
  MYSQL_ALLOW_EMPTY_PASSWORD: yes

jobs:
  # ========== JOB 1: AUTH SERVICE ==========
  test-auth-service:
    runs-on: ubuntu-latest
    name: Auth Service Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: authdb
          MYSQL_ALLOW_EMPTY_PASSWORD: ${{ env.MYSQL_ALLOW_EMPTY_PASSWORD }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: �� Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/auth-service/package-lock.json

      - name: Install Auth Dependencies
        working-directory: backend/auth-service
        run: npm ci

      - name: ⏳ Wait for Auth MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 --silent; then
              echo "✅ Auth MySQL ready!"
              break
            fi
            sleep 3
          done

      - name: Run Auth Tests
        working-directory: backend/auth-service
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: authdb
          JWT_SECRET: test-secret-key-for-ci
          PORT: 5000
        run: npm test

      - name: Auth Test Results
        run: echo "✅ Auth Service tests completed successfully"

  # ========== JOB 2: ORDER SERVICE ==========
  test-order-service:
    runs-on: ubuntu-latest
    name: Order Service Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: orderdb
          MYSQL_ALLOW_EMPTY_PASSWORD: ${{ env.MYSQL_ALLOW_EMPTY_PASSWORD }}
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmqctl status"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/order-service/package-lock.json

      - name: Install Order Dependencies
        working-directory: backend/order-service
        run: npm ci

      - name: ⏳ Wait for Order Services
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3309 --silent; then
              echo "✅ Order MySQL ready!"
              break
            fi
            sleep 3
          done

          echo "Waiting for RabbitMQ..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:15672/api/overview -u admin:password >/dev/null 2>&1; then
              echo "✅ RabbitMQ ready!"
              break
            fi
            sleep 3
          done

      - name: Run Order Tests
        working-directory: backend/order-service
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3309
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: orderdb
          RABBITMQ_URL: amqp://admin:password@127.0.0.1:5672
          PORT: 5002
        run: npm test

      - name: Order Test Results
        run: echo "✅ Order Service tests completed successfully"

  # ========== JOB 3: PRODUCT SERVICE ==========
  test-product-service:
    runs-on: ubuntu-latest
    name: Product Service Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: productdb
          MYSQL_ALLOW_EMPTY_PASSWORD: ${{ env.MYSQL_ALLOW_EMPTY_PASSWORD }}
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/product-service/package-lock.json

      - name: Install Product Dependencies
        working-directory: backend/product-service
        run: npm ci

      - name: Create Upload Directory
        working-directory: backend/product-service
        run: mkdir -p uploads

      - name: ⏳ Wait for Product MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3308 --silent; then
              echo "✅ Product MySQL ready!"
              break
            fi
            sleep 3
          done

      - name: Run Product Tests
        working-directory: backend/product-service
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: productdb
          PORT: 5001
        run: npm test

      - name: Product Test Results
        run: echo "✅ Product Service tests completed successfully"

  # ========== JOB 4: SECURITY & BUILD ==========
  security-and-build:
    runs-on: ubuntu-latest
    name: Security & Build
    needs: [test-auth-service, test-order-service, test-product-service]

    strategy:
      matrix:
        service: [auth-service, order-service, product-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Security Audit
        working-directory: backend/${{ matrix.service }}
        run: |
          echo " Running security audit for ${{ matrix.service }}..."
          npm audit --audit-level high || echo "⚠️ Security audit completed with warnings"

      - name: Build Docker Image
        working-directory: backend/${{ matrix.service }}
        run: |
          echo " Building Docker image for ${{ matrix.service }}..."
          if [ -f Dockerfile ]; then
            docker build -t payetonkawa-${{ matrix.service }}:${{ github.sha }} .
            echo "✅ Docker image built successfully!"
          else
            echo "⚠️ No Dockerfile found for ${{ matrix.service }}"
          fi

  # ========== JOB 5: DEPLOYMENT SUMMARY ==========
  deployment-summary:
    runs-on: ubuntu-latest
    name: Deployment Summary
    needs:
      [
        test-auth-service,
        test-order-service,
        test-product-service,
        security-and-build,
      ]
    if: always()

    steps:
      - name: Generate Test Summary
        run: |
          echo "# ☕️ PayeTonKawa CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "##  Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "-  **Auth Service**: ${{ needs.test-auth-service.result }}" >> $GITHUB_STEP_SUMMARY
          echo "-  **Order Service**: ${{ needs.test-order-service.result }}" >> $GITHUB_STEP_SUMMARY
          echo "-  **Product Service**: ${{ needs.test-product-service.result }}" >> $GITHUB_STEP_SUMMARY
          echo "-  **Security & Build**: ${{ needs.security-and-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "##  Statistics:" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Services**: 3" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: ~69 tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test-auth-service.result }}" == "success" && "${{ needs.test-order-service.result }}" == "success" && "${{ needs.test-product-service.result }}" == "success" ]]; then
            echo "##  **ALL TESTS PASSED** - Ready for deployment! ☕️" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ **SOME TESTS FAILED** - Please check the logs above" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deployment Status
        run: |
          if [[ "${{ needs.test-auth-service.result }}" == "success" && "${{ needs.test-order-service.result }}" == "success" && "${{ needs.test-product-service.result }}" == "success" ]]; then
            echo " All PayeTonKawa services are ready for deployment!"
            echo "✅ Auth Service: Ready"
            echo "✅ Order Service: Ready"  
            echo "✅ Product Service: Ready"
          else
            echo "❌ Some services failed - deployment blocked"
            exit 1
          fi
