name: Ì≥¨ PayeTonKawa Notifications

on:
  workflow_run:
    workflows: ["‚òïÔ∏è PayeTonKawa - Full CI/CD Pipeline"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Ì≥¨ Notification Summary
      run: |
        if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
          echo "Ìæâ PayeTonKawa CI/CD Pipeline succeeded!"
          echo "‚úÖ All tests passed for commit ${{ github.event.workflow_run.head_sha }}"
          echo "Ì∫Ä Ready for deployment!"
        else
          echo "‚ùå PayeTonKawa CI/CD Pipeline failed!"
          echo "Ì¥ç Check the logs for commit ${{ github.event.workflow_run.head_sha }}"
          echo "Ì≥ã Branch: ${{ github.event.workflow_run.head_branch }}"
        fi
        
        echo ""
        echo "Ì≥ä Pipeline Details:"
        echo "- Workflow: ${{ github.event.workflow_run.name }}"
        echo "- Status: ${{ github.event.workflow_run.conclusion }}"
        echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
        echo "- Author: ${{ github.event.workflow_run.actor.login }}"
        echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
