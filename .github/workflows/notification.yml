name: PayeTonKawa Notifications

on:
  workflow_run:
    workflows: ["☕️ PayeTonKawa - Full CI/CD Pipeline"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notification Summary
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo " PayeTonKawa CI/CD Pipeline succeeded!"
            echo "✅ All tests passed for commit ${{ github.event.workflow_run.head_sha }}"
            echo " Ready for deployment!"
          else
            echo "❌ PayeTonKawa CI/CD Pipeline failed!"
            echo " Check the logs for commit ${{ github.event.workflow_run.head_sha }}"
            echo " Branch: ${{ github.event.workflow_run.head_branch }}"
          fi

          echo ""
          echo " Pipeline Details:"
          echo "- Workflow: ${{ github.event.workflow_run.name }}"
          echo "- Status: ${{ github.event.workflow_run.conclusion }}"
          echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "- Author: ${{ github.event.workflow_run.actor.login }}"
          echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
