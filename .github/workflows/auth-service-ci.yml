name: Auth Service CI

on:
  push:
    branches: [ main, develop, Mokrane_UP ]
    paths: 
      - 'backend/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/auth-service/**'

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    name: Build & Test Auth Service
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: authdb
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/auth-service/package-lock.json

    - name: Install Dependencies
      working-directory: backend/auth-service
      run: |
        echo "Ì≥¶ Installing npm packages for Auth Service..."
        npm ci
        echo "‚úÖ Dependencies installed successfully"

    - name: Wait for MySQL
      run: |
        echo "‚è≥ Waiting for MySQL to be ready..."
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -P 3307 --silent; then
            echo "‚úÖ MySQL is ready!"
            break
          fi
          echo "‚è≥ MySQL not ready yet... ($i/30)"
          sleep 3
        done

    - name: Run Tests
      working-directory: backend/auth-service
      env:
        NODE_ENV: test
        DB_HOST: 127.0.0.1
        DB_PORT: 3307
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: authdb
        JWT_SECRET: test-jwt-secret-for-github-actions
      run: |
        echo "Ì∑™ Running tests for Auth Service..."
        npm test
        echo "‚úÖ All tests passed!"

    - name: Build Docker Image
      working-directory: backend/auth-service
      run: |
        echo "Ì∞≥ Building Docker image for Auth Service..."
        docker build -t payetonkawa-auth:${{ github.sha }} .
        echo "‚úÖ Docker image built successfully!"

    - name: Security Audit
      working-directory: backend/auth-service
      run: |
        echo "Ì¥í Running security audit..."
        npm audit --audit-level high || echo "‚ö†Ô∏è Security audit completed with warnings"
