name: CD Backend (Docker Compose)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy backend to server (rsync)
        run: |
          rsync -avz --delete --exclude '.git*' --exclude 'node_modules' ./backend/ user@your-server:/home/ubuntu/PayeTonKawa/backend

      - name: Copy docker-compose.yml to server
        run: |
          rsync -avz ./backend/docker-compose.yml user@your-server:/home/ubuntu/PayeTonKawa/backend/docker-compose.yml

      - name: Deploy with Docker Compose
        run: |
          ssh user@your-server "cd /home/ubuntu/PayeTonKawa/backend && docker-compose pull && docker-compose up -d --build"

# Remplace 'user@your-server' et '/home/ubuntu/PayeTonKawa/backend' par tes informations réelles.
# Ajoute ta clé SSH privée dans les secrets GitHub sous le nom SSH_PRIVATE_KEY. 