name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies for all services
      run: |
        cd backend/auth-service && npm ci
        cd ../product-service && npm ci
        cd ../order-service && npm ci
        cd ../../frontend && npm ci
    
    - name: Run npm audit
      run: |
        echo "=== Auth Service Security Scan ==="
        cd backend/auth-service && npm audit --audit-level=moderate || echo "Vulnerabilities found in auth-service"
        
        echo "=== Product Service Security Scan ==="
        cd ../product-service && npm audit --audit-level=moderate || echo "Vulnerabilities found in product-service"
        
        echo "=== Order Service Security Scan ==="
        cd ../order-service && npm audit --audit-level=moderate || echo "Vulnerabilities found in order-service"
        
        echo "=== Frontend Security Scan ==="
        cd ../../frontend && npm audit --audit-level=moderate || echo "Vulnerabilities found in frontend"
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true
    
    - name: Run OWASP ZAP scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'http://localhost:3000'
      continue-on-error: true
    
    - name: Notify security issues
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: 'Security vulnerabilities detected! Please review the scan results.'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure() 