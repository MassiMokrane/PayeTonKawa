name: Backend Services CI

on:
  push:
    branches: [ main, develop, Mokrane_rabah_up ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.changes.outputs.auth-service }}
      product-service: ${{ steps.changes.outputs.product-service }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          auth-service:
            - 'backend/auth-service/**'
          product-service:
            - 'backend/product-service/**'

  auth-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth-service == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/auth-service/package-lock.json

    - name: Install dependencies
      working-directory: backend/auth-service
      run: npm ci

    - name: Run auth-service tests
      working-directory: backend/auth-service
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: testsecret
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: test
        DB_NAME: test_authdb

  product-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.product-service == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/product-service/package-lock.json

    - name: Install dependencies
      working-directory: backend/product-service
      run: npm ci

    - name: Run product-service tests
      working-directory: backend/product-service
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: testsecret
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: test
        DB_NAME: test_productdb
        DB_PORT: 3306

  summary:
    runs-on: ubuntu-latest
    needs: [auth-service, product-service]
    if: always()
    steps:
    - name: Summary
      run: |
        echo "í¾‰ Backend CI Summary:"
        echo "Auth Service: ${{ needs.auth-service.result }}"
        echo "Product Service: ${{ needs.product-service.result }}"
